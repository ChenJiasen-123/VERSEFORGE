# RPE-GA 中文诗歌逆向提示词实验配置
# 仅此文件中的参数会进入实验；CLI 可覆盖预算等少量参数。
experiment:
  name: haizi-rpe-ga
  seed: 20251125
  output_root: experiments/reverse_prompt_engineering/runs
  language: zh
  notes: "扩展原型：15首参考诗、13首留出诗、5个优化题目、10个测试题目、种群5、4代；新增5个评审维度与3个确定性结构指标。"

corpus:
  # 该语料来自项目已有的海子诗歌归档；原文件在 var/ 下且不随 git 分发。
  path: var/haizi/corpus.jsonl
  id_prefix: haizi-
  reference_split: train
  reference_count: 15
  # 留空时按 metadata.core_rank 排序自动选取；也可显式列出 poem_id。
  reference_poem_ids: []
  reference_order: core_rank
  held_out_split: held_out
  held_out_count: 13
  held_out_poem_ids: []
  exclude_flags: [is_fragment, is_duplicate, misattributed, is_translation]
  # target_name 只用于基线A和提示词禁用名检查；不会发送给初始化、分析或变异调用。
  target_name: 海子
  target_aliases: []
  # 自动选诗时排除正文直接出现诗人姓名的作品，避免姓名触发或身份泄露。
  exclude_target_name_in_auto_selection: true
  max_reference_chars: 1200
  max_held_out_chars: 1200

topics:
  optimization:
    - id: opt-01
      topic: 深夜医院走廊尽头的自动售货机
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；写深夜、机器与人的疲惫；不得出现任何诗人姓名。"
    - id: opt-02
      topic: 洪水退去后的乡村小学操场
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；写灾后清理与儿童返校；不得出现任何诗人姓名。"
    - id: opt-03
      topic: 跨江大桥下的夜班渡轮
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；写夜班工人、江水与城市灯光；不得出现任何诗人姓名。"
    - id: opt-04
      topic: 凌晨四点的农产品批发市场
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；写夜班搬运、湿冷地面与城市将醒；不得出现任何诗人姓名。"
    - id: opt-05
      topic: 沙漠公路旁的废弃加油站
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；写风沙、铁皮棚与过路人的短暂停留；不得出现任何诗人姓名。"
  test:
    - id: test-01
      topic: 搬家日留下的空房间
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-02
      topic: 山顶气象站停电的夜晚
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-03
      topic: 旧火车站行李寄存处的雨伞
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-04
      topic: 城市天台上的小型菜园
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-05
      topic: 河滩上被风吹走的帐篷
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-06
      topic: 海边灯塔的最后一位守塔人
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-07
      topic: 老式电影院散场后的放映室
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-08
      topic: 雪后山村的有线广播站
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-09
      topic: 城市地下通道里的修鞋摊
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"
    - id: test-10
      topic: 水库泄洪前夜的观测站
      genre: modern
      max_lines: 20
      requirements: "12—20行，分2—4节；每节1—6行；不得出现任何诗人姓名。"

generation:
  repetitions: 1
  temperature: 1.0
  max_tokens: 1200
  thinking: disabled
  default_genre: modern
  default_max_lines: 20
  default_requirements: "12—20行，分2—4节；每节1—6行；使用现代汉语；不得出现任何诗人姓名。"

population:
  size: 5
  generations: 30
  initialization_mode: independent
  init_temperature: 1.0
  init_max_tokens: 1400
  mutation_temperature: 0.8
  mutation_max_tokens: 2000
  analysis_temperature: 0.2
  analysis_max_tokens: 4000
  # 初始化/分析/变异统一关闭思考模式，避免 reasoning token 挤占输出预算。
  thinking: disabled
  min_prompt_chars: 120
  max_prompt_chars: 1400
  max_prompt_repair_attempts: 1
  patience: 5
  min_improvement: 0.25
  # 每 5 代写一次 checkpoints/gen_XXX/ 快照；0 表示关闭。
  checkpoint_every: 5

evaluation:
  # null 表示与生成使用同一模型；也可设 DEEPSEEK_JUDGE_MODEL 环境变量。
  # 现有客户端只能调用 DeepSeek；切换模型名仍是同家族，需在报告中记录自评偏差。
  judge_model: null
  judge_temperature: 0.0
  judge_max_tokens: 3800
  judge_thinking: disabled
  rubric_version: rpe-poetry-zh-v1
  deterministic_style_weight: 0.35
  judge_style_weight: 0.65
  quality_weight: 0.15
  # Judge 风格维度加权。progression（推进感）单独拉高，其余维度相应下调。
  style_dimension_weights:
    progression: 0.24
    structure: 0.10
    imagery: 0.09
    emotion: 0.08
    lexical: 0.07
    syntax: 0.07
    lineation: 0.07
    concreteness: 0.06
    repetition: 0.06
    closure: 0.06
    addressivity: 0.05
    mythic_register: 0.05
  topic_threshold: 3.0
  originality_threshold: 3.0
  quality_floor: 2.0
  form_penalty: 30.0
  topic_penalty_scale: 15.0
  originality_penalty_scale: 15.0
  quality_penalty_scale: 15.0
  copy_penalty: 30.0
  copy_lcs_chars: 12
  copy_line_chars: 8
  copy_rouge1_cap: 0.80
  confirmation_top_k: 3
  confirmation_repetitions: 1
  judge_evidence_required: true

prompt_rules:
  max_reference_ngram: 12
  warn_reference_ngram: 8
  max_vague_phrases: 2
  min_instruction_units: 3
  forbidden_dependency_phrases:
    - 参考上面
    - 参考上述
    - 上述作品
    - 以上作品
    - 这些诗
    - 前文
    - 上面这些
    - 所给作品
    - 给出的诗
    - 参考作品
    - 参考诗
    - 上述
    - 上面
    - 这些作品
    - 原作
    - 旧作
  vague_phrases:
    - 富有诗意
    - 意境深远
    - 意境优美
    - 语言优美
    - 文采斐然
    - 情感真挚
    - 风格独特
    - 别具一格
    - 引人入胜
    - 浑然天成
    - 耐人寻味
    - 独具匠心
    - 诗意盎然
    - 跃然纸上

budget:
  max_api_calls: 2500
  max_total_tokens: 12000000
  request_timeout: 90
  max_parse_retries: 2
  # 供应商价格随时变化；留空时只统计 token，不推算费用。
  price_per_million_input: null
  price_per_million_output: null
  require_authorization: true

benchmark:
  enabled: true
  repetitions: 1
  temperature: 1.0
  max_tokens: 1200
  baseline_a_prompt: "请模仿诗人{target_name}的风格，围绕题目“{topic}”创作一首现代诗。要求：{requirements}"
  groups: [A, B, C]
