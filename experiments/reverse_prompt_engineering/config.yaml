# RPE-GA 中文诗歌逆向提示词实验配置（v3：经语料审计的分布指标 + 独立 Judge + 受控交叉与精简约束）
experiment:
  name: haizi-rpe-ga
  seed: 20261126
  output_root: experiments/reverse_prompt_engineering/runs
  language: zh
  notes: "v3：语料分位带+TF-IDF+反套路确定性指标；deepseek-chat独立匿名评审；数据锚定初始化、诊断驱动变异、精英语义交叉、种群去克隆与轮内双样本确认。"

corpus:
  path: var/haizi/corpus.jsonl
  id_prefix: haizi-
  reference_split: train
  reference_count: 15
  reference_poem_ids: []
  reference_order: core_rank
  held_out_split: held_out
  held_out_count: 13
  held_out_poem_ids: []
  exclude_flags: [is_fragment, is_duplicate, misattributed, is_translation]
  target_name: 海子
  target_aliases: []
  exclude_target_name_in_auto_selection: true
  max_reference_chars: 1200
  max_held_out_chars: 1200

