# RPE-GA 中文诗歌逆向提示词实验配置（v6：锻造唯一“诗核”主轴与中后段破壁力 + 严禁散珠贴喻/散文逗号/虚假呼告/轻放退场）
experiment:
  name: haizi-rpe-ga
  seed: 20261129
  output_root: experiments/reverse_prompt_engineering/runs
  language: zh
  notes: "v6：升级rpe-poetry-style-v6（新增主核意象跨节贯通率core_motif_span、核心实字凝聚度core_lexical_focus、贴喻节率simile_stanza_rate、行内逗号防散文化comma_per_line与套路轻放收尾惩罚tame_putdown_closure，下调反转噪声mid_stanza_novelty至0.01）+ rpe-poetry-zh-v5（新增首位核心维度poetic_core权重0.18，下调addressivity至0.02遏制虚假呼告）。"

corpus:
