generation:
  repetitions: 1
  temperature: 1.0
  max_tokens: 1200
  thinking: disabled
  max_form_repair_attempts: 1
  default_genre: modern
  default_max_lines: 20
  default_requirements: "12—20行，分2—4节；每节1—6行；使用现代汉语；不得出现任何诗人姓名。"

population:
  size: 6
  generations: 8
  crossover_count: 2
  survivor_max_similarity: 0.88
  in_run_confirm_top_k: 2
  initialization_mode: independent
  init_temperature: 0.95
  init_max_tokens: 1400
  mutation_temperature: 0.8
  mutation_max_tokens: 1800
  analysis_temperature: 0.2
  analysis_max_tokens: 4000
  thinking: disabled
  min_prompt_chars: 120
  max_prompt_chars: 600
  max_prompt_repair_attempts: 2
  patience: 3
  min_improvement: 0.20
  checkpoint_every: 2

evaluation:
  # 使用不同于生成模型(deepseek-flash)的 deepseek-chat 担任匿名评审，减轻同模型打分饱和与自评偏好。
  judge_model: deepseek-chat
  judge_temperature: 0.0
  judge_max_tokens: 3800
  judge_thinking: disabled
  rubric_version: rpe-poetry-zh-v2
  deterministic_style_weight: 0.40
  judge_style_weight: 0.60
  quality_weight: 0.15
  prompt_length_free: 480
  prompt_length_penalty_per_100_chars: 3.0
  prompt_length_penalty_max: 8.0
  style_dimension_weights:
    progression: 0.00
    imagery: 0.14
    emotion: 0.13
    lexical: 0.12
    syntax: 0.11
    lineation: 0.11
    mythic_register: 0.09
    structure: 0.09
    repetition: 0.07
    closure: 0.06
    addressivity: 0.04
    concreteness: 0.04
  topic_threshold: 3.0
  originality_threshold: 3.0
  quality_floor: 2.0
  form_penalty: 30.0
  topic_penalty_scale: 15.0
  originality_penalty_scale: 15.0
  quality_penalty_scale: 15.0
  copy_penalty: 30.0
  copy_lcs_chars: 12
  copy_line_chars: 8
  copy_rouge1_cap: 0.80
  confirmation_top_k: 6
  confirmation_repetitions: 1
  judge_evidence_required: true

prompt_rules:
  max_reference_ngram: 12
  warn_reference_ngram: 8
  max_vague_phrases: 2
  min_instruction_units: 3
  max_instruction_units: 8
  forbid_hardcoded_poem_counts: true
  forbidden_meta_phrases:
    - 完成后自检
    - 定稿前自检
    - 成稿后逐条自查
    - 数出明喻
    - 任一项不满足则重写
    - 逐项统计
    - 自查清单
  forbidden_signature_props:
    - 麦地
    - 麦穗
    - 麦子
    - 粮仓
    - 草原
    - 德令哈
    - 青海湖
    - 敦煌
    - 亚洲铜
    - 以梦为马
    - 面朝大海
  forbidden_dependency_phrases:
    - 参考上面
    - 参考上述
    - 上述作品
    - 以上作品
    - 这些诗
    - 前文
    - 上面这些
    - 所给作品
    - 给出的诗
    - 参考作品
    - 参考诗
    - 上述
    - 这些作品
    - 原作
    - 旧作
  vague_phrases:
    - 富有诗意
    - 意境深远
    - 意境优美
    - 语言优美
    - 文采斐然
    - 情感真挚
    - 风格独特
    - 别具一格
    - 引人入胜
    - 浑然天成
    - 耐人寻味
    - 独具匠心
    - 诗意盎然
    - 跃然纸上

budget:
  max_api_calls: 100000
  max_total_tokens: 1000000000
  request_timeout: 90
  max_parse_retries: 2
  price_per_million_input: null
  price_per_million_output: null
  require_authorization: true

benchmark:
  enabled: true
  repetitions: 2
  temperature: 1.0
  max_tokens: 1200
  baseline_a_prompt: "请模仿诗人{target_name}的风格，围绕题目“{topic}”创作一首现代诗。要求：{requirements}"
  groups: [A, B, C]
